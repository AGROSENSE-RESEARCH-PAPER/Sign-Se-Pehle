# Render blueprint for the Sign Se Pehle API (Docker, so OCR deps ship).
# In Render: New -> Web Service -> Build from this GitHub repo, or
# "New from Blueprint" with this file. Then set the env vars below.
services:
  - type: web
    name: sign-se-pehle-api
    env: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: LLM_API_KEY
        sync: false
