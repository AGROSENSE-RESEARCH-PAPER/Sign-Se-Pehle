# Deploy the Vite UI to GitHub Pages.
# Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# (one-time, owner only). After that, every push to main redeploys.
# NOTE (2026-10-24): the live Pages site is now the Figma UI in
# apps/figma-ui (a synthetic demo: hardcoded sample, no real upload/API).
# The previous Next.js v1 app is still in the repo under apps/web/ but
# is NOT built or deployed by this workflow. Revert this workflow to
# restore the v1 site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/figma-ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/figma-ui/package-lock.json
      - name: Install and build (Vite static site)
        working-directory: apps/figma-ui
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/figma-ui/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
